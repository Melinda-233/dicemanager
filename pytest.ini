[pytest]
testpaths = tests
# 全量跑法必备（缺一即红/卡死，2026-10 起 CI 连挂的根因）：
#   no:nonebug         nonebug 异步 fixture 泄漏会致收集 ERROR / 整套卡死
#   no:cacheprovider  规避 cacheprovider 副作用
#   --ignore=tests/test_ws_channels.py  该文件依赖预置 auth.json，独立跑会
#                      KeyError:'admin' 且污染其它用例，按项目约定整体跳过
#                      （其 WS 契约由 tests/smoke_*.py 独立进程补充覆盖）
# tests/win/* 由 tests/win/conftest.py 在非 desktop 平台自动 skip，无需在此处理。
addopts = -p no:nonebug -p no:cacheprovider --ignore=tests/test_ws_channels.py
