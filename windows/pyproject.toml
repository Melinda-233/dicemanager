[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["web", "tests", ".workbuddy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM"]
# 与 Linux 版同口径：紧凑单行风格豁免
ignore = ["E501", "E402", "E701", "E702", "SIM105"]

[tool.ruff.lint.per-file-ignores]
# B008：Depends()/HTTPBearer() 作为参数默认值是 FastAPI 惯用法
"api/rest.py" = ["B008"]
"api/auth.py" = ["B008"]
# SIM115：持久日志句柄 / 常驻 fd 是刻意设计，非泄漏
"core/process.py" = ["SIM115"]
"core/locks.py" = ["SIM115"]

[tool.mypy]
python_version = "3.12"
# 关键差异：Linux 版 platform=linux（fcntl/killpg/SIGKILL 为真实 API）
# Windows 版 platform=win32（msvcrt/taskkill/CREATE_NEW_PROCESS_GROUP 为真实 API）
platform = "win32"
ignore_missing_imports = true
check_untyped_defs = true
warn_unreachable = true
files = ["core", "services", "api", "adapters"]
