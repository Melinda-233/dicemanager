name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    # 固定 24.04：ubuntu-latest 将于 2026-10-19 起迁移到 Ubuntu 26，避免某天构建环境突变
    runs-on: ubuntu-24.04        # 项目目标是 Linux（fcntl/killpg），CI 与生产一致
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy, core+services+api+adapters)
        run: mypy
      - name: Regression tests
        run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build frontend
        run: npm ci --prefix web && npm run build --prefix web
