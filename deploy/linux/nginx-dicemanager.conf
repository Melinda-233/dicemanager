# /etc/nginx/conf.d/dicemanager.conf
# 管理器本身只监听 127.0.0.1:8765，由 Nginx 对外提供访问并终结 TLS。
# WebSocket 必须带 Upgrade / Connection 头，否则总览、日志、登录二维码都不会动。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8888;                        # 勿改 80：该机 80 已被既有站点以 default_server 占用，改 80 会被抢走导致站点不可达
    server_name _;                      # 有域名就改成你的域名

    # 对齐离线包上限 2GB：小于此值会被 nginx 直接 413，用户看不到应用层提示
    client_max_body_size 2048m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（总览 / 日志 / 登录三条通道）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 离线包上传的进度条会先走到 100%、再停在「服务端校验中」：
        # nginx 默认 proxy_request_buffering on，会先把整个请求体缓冲完再转发给后端，
        # 这段时间前端已经发完（100%），实际是 nginx→后端的转发 + 后端落盘校验。
        # 有意保留默认：改成 off 虽能让进度更线性，但后端在读完 body 前返回 413/400 时
        # nginx 已发出响应头，浏览器只会看到「网络中断」而拿不到「超过大小上限」的提示。
    }
}
